name: Build Morphe Patch Package

on:
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/build-morphe-patch.yml'
  workflow_dispatch:
  release:
    types: [published, edited]

jobs:
  build-mpp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Morphe Patch Package (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew buildAndroid --no-daemon || ./gradlew :patches:buildAndroid --no-daemon || ./gradlew build --no-daemon

      - name: Upload .mpp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelcamera-patches
          path: '**/build/libs/*.mpp'
          if-no-files-found: warn

      - name: Attach .mpp to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/libs/*.mpp'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
